name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The suite is dependency-free (node:test + node:assert), so there is no
      # install step. It covers what the previous inline checks did — every .mjs
      # parses, every manifest is valid — plus the behavior those checks could not
      # see: onboard's detection/rendering, the drift clustering rules, and the
      # cross-manifest version sync.
      - name: Unit tests
        run: node --test tests/*.test.mjs
